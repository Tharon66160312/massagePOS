services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lamun
      POSTGRES_PASSWORD: lamun
      POSTGRES_DB: lamun
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lamun"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://lamun:lamun@db:5432/lamun?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-only-change-me}
    ports: ["3001:3001"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    environment:
      PORT: "3000"
      BACKEND_URL: http://backend:3001
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-only-change-me}
    ports: ["3000:3000"]

volumes:
  pgdata:
